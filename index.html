<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penilaian SMAN 1 CIDAHU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .glass-card { background: #ffffff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.05); }
        .table-custom th { background-color: #212529; color: #fff; font-weight: 500; }
        .action-btn { cursor: pointer; color: #0d6efd; transition: 0.2s; }
        .action-btn:hover { color: #0a58ca; }
        .pdf-header { display: none; text-align: center; margin-bottom: 20px; }
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; display: none; justify-content: center; align-items: center; flex-direction: column; }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner-border text-primary" role="status"></div>
    <h5 class="mt-3 fw-bold text-dark" id="loadingText">Memproses...</h5>
</div>

<div class="container-fluid py-5 px-4">
    <div class="text-center mb-5">
        <h2 class="fw-bold text-dark"><i class="bi bi-bar-chart-line-fill text-primary"></i> Penilaian SMAN 1 CIDAHU</h2>
    </div>

    <div class="row g-4">
        <div class="col-lg-3">
            <div class="glass-card p-4 h-100">
                <h5 class="fw-bold mb-3"><i class="bi bi-gear-fill text-primary"></i> Panel Kontrol</h5>
                
                <div class="d-grid gap-2">
                    <button class="btn btn-warning fw-bold btn-sm text-white" onclick="bersihkanData()">
                        <i class="bi bi-trash"></i> Bersihkan Semua Data
                    </button>
                    <hr>
                    
                    <!-- TOMBOL SIMPAN KE GOOGLE SHEETS -->
                    <button class="btn btn-primary fw-bold btn-sm mb-2" onclick="simpanKeGoogleSheets()">
                        <i class="bi bi-cloud-arrow-up"></i> Simpan ke Spreadsheet
                    </button>
                    
                    <button class="btn btn-outline-secondary fw-bold btn-sm" onclick="downloadFormat()">
                        <i class="bi bi-file-earmark-arrow-down"></i> Download Format Excel
                    </button>
                    <label for="fileUpload" class="btn btn-secondary w-100 mb-0 fw-bold btn-sm">
                        <i class="bi bi-file-earmark-arrow-up"></i> Upload Excel Lokal
                    </label>
                    <input type="file" id="fileUpload" accept=".xlsx, .xls, .csv" class="d-none" onchange="handleFileUpload(event)">
                    <hr>
                    <button class="btn btn-success fw-bold btn-sm" id="btnDownload" onclick="downloadHasil()" disabled>
                        <i class="bi bi-file-excel"></i> Export Hasil (Excel)
                    </button>
                    <button class="btn btn-danger fw-bold btn-sm" id="btnPdf" onclick="exportPDF()" disabled>
                        <i class="bi bi-file-pdf-fill"></i> Export Hasil (PDF)
                    </button>
                </div>
            </div>
        </div>

        <div class="col-lg-9">
            <div class="glass-card p-4 h-100" id="areaPrint">
                <div class="pdf-header" id="pdfHeader">
                    <h3 class="fw-bold m-0">Laporan Penilaian Ekonomi</h3>
                    <h4 class="text-muted m-0">SMAN 1 CIDAHU</h4>
                    <hr>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4" id="tableHeaderTitle">
                    <h5 class="fw-bold m-0"><i class="bi bi-table text-success"></i> Data Rapor</h5>
                    <span class="badge bg-secondary" id="countData">0 Siswa</span>
                </div>

                <div class="table-responsive border rounded" id="tableContainer" style="max-height: 400px; overflow-y: auto;">
                    <table class="table table-hover table-custom align-middle m-0">
                        <thead class="sticky-top">
                            <tr>
                                <th>Nama Siswa</th>
                                <th class="text-center">Ulangan</th>
                                <th class="text-center">Aktif</th>
                                <th class="text-center">Sikap</th>
                                <th class="text-center">Hadir</th>
                                <th class="text-center">N. Rapor</th>
                                <th class="text-center aksi-col">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelHasil">
                            <tr><td colspan="7" class="text-center py-5 text-muted">Belum ada data.</td></tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="row mt-4" id="summaryStats" style="display: none;">
                    <div class="col-4"><div class="alert alert-info text-center py-2"><div class="small fw-bold">Rata-Rata</div><div class="fs-4 fw-bold" id="statAvg">-</div></div></div>
                    <div class="col-4"><div class="alert alert-success text-center py-2"><div class="small fw-bold">Tertinggi</div><div class="fs-4 fw-bold" id="statMax">-</div></div></div>
                    <div class="col-4"><div class="alert alert-warning text-center py-2"><div class="small fw-bold">Terendah</div><div class="fs-4 fw-bold" id="statMin">-</div></div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let dataSiswa = [];

    // FUNGSI MENYIMPAN KE GOOGLE SHEETS
    async function simpanKeGoogleSheets() {
        if (dataSiswa.length === 0) {
            alert("Tidak ada data untuk disimpan ke Spreadsheet.");
            return;
        }
        
        document.getElementById('loadingText').innerText = "Menyimpan ke Spreadsheet...";
        document.getElementById('loadingOverlay').style.display = 'flex';

        // URL App Script yang sudah Anda berikan
        const webAppUrl = "https://script.google.com/macros/s/AKfycbzxoZ6d5o09ddp3ytSI6aQ253i44ZiABfKwOlUNPy2dFaGYgbOlcYmaacoGX_W1WrZd/exec"; 
        
        // Format payload array 2D
        const payload = [["Nama Siswa", "Ulangan", "Keaktifan", "Sikap", "Kehadiran", "Nilai Akhir Rapor"]];
        dataSiswa.forEach(s => {
            const murni = Math.round((s.ulangan * 0.5) + (s.aktif * 0.2) + (s.sikap * 0.15) + (s.hadir * 0.15));
            const akhir = Math.max(65, Math.min(85, murni));
            payload.push([s.nama, s.ulangan, s.aktif, s.sikap, s.hadir, akhir]);
        });

        try {
            await fetch(webAppUrl, {
                method: "POST",
                mode: "no-cors", // Cegah blokir CORS dari browser
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            });
            document.getElementById('loadingOverlay').style.display = 'none';
            alert("Selesai! Data berhasil dikirim ke Spreadsheet Anda.");
        } catch (error) {
            document.getElementById('loadingOverlay').style.display = 'none';
            console.error("Error:", error);
            alert("Gagal koneksi. Pastikan internet lancar dan URL script valid.");
        }
    }

    function bersihkanData() {
        if(confirm("Apakah Anda yakin ingin menghapus seluruh data yang ada di layar?")) {
            dataSiswa = [];
            renderTabel();
        }
    }

    function renderTabel() {
        const tbody = document.getElementById('tabelHasil');
        const btnDownload = document.getElementById('btnDownload');
        const btnPdf = document.getElementById('btnPdf');
        const countData = document.getElementById('countData');
        const summaryStats = document.getElementById('summaryStats');
        
        if (dataSiswa.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">Belum ada data. Silakan upload file baru.</td></tr>';
            btnDownload.disabled = true;
            btnPdf.disabled = true;
            summaryStats.style.display = 'none';
            countData.innerText = "0 Siswa";
            return;
        }

        tbody.innerHTML = '';
        countData.innerText = dataSiswa.length + " Siswa";
        let total = 0, max = -Infinity, min = Infinity;

        dataSiswa.forEach((siswa, index) => {
            const murni = Math.round((siswa.ulangan * 0.5) + (siswa.aktif * 0.2) + (siswa.sikap * 0.15) + (siswa.hadir * 0.15));
            const akhir = Math.max(65, Math.min(85, murni));
            total += akhir;
            if (akhir > max) max = akhir;
            if (akhir < min) min = akhir;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="fw-bold">${siswa.nama}</td>
                <td class="text-center">${siswa.ulangan}</td>
                <td class="text-center">${siswa.aktif}</td>
                <td class="text-center">${siswa.sikap}</td>
                <td class="text-center">${siswa.hadir}</td>
                <td class="text-center fw-bold text-primary">${akhir}</td>
                <td class="text-center aksi-col"><i class="bi bi-trash action-btn text-danger" onclick="hapusSiswa(${index})"></i></td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('statAvg').innerText = (total/dataSiswa.length).toFixed(1);
        document.getElementById('statMax').innerText = max;
        document.getElementById('statMin').innerText = min;
        summaryStats.style.display = 'flex';
        btnDownload.disabled = false;
        btnPdf.disabled = false;
    }

    function hapusSiswa(index) {
        dataSiswa.splice(index, 1);
        renderTabel();
    }

    function handleFileUpload(event) {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, {type: 'array'});
            const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
            for (let i = 1; i < json.length; i++) {
                if(json[i][0]) dataSiswa.push({nama: json[i][0], ulangan: json[i][1], aktif: json[i][2], sikap: json[i][3], hadir: json[i][4]});
            }
            renderTabel();
        };
        reader.readAsArrayBuffer(file);
    }
    
    function downloadFormat() {
        const ws = XLSX.utils.aoa_to_sheet([["Nama Siswa", "Ulangan", "Keaktifan", "Sikap", "Kehadiran"]]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Format");
        XLSX.writeFile(wb, "Format_Input_Nilai.xlsx");
    }

    function downloadHasil() {
        const ws = XLSX.utils.json_to_sheet(dataSiswa);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Hasil");
        XLSX.writeFile(wb, "Hasil_Penilaian.xlsx");
    }

    function exportPDF() {
        const element = document.getElementById('areaPrint');
        const aksiCols = document.querySelectorAll('.aksi-col');
        aksiCols.forEach(el => el.style.display = 'none');
        
        html2pdf().from(element).save('Laporan_Siswa.pdf').then(() => {
            aksiCols.forEach(el => el.style.display = '');
        });
    }
</script>
</body>
</html>
